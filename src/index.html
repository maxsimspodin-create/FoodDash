<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>FoodDash</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<header class="bg-white border-b border-orange-100 sticky top-0 shadow-sm">
			<div
				class="max-w-7xl mx-auto px-6 h-16 flex justify-between items-center gap-6"
			>
				<a
					href="#"
					class="text-xl text-brand-500 font-black flex gap-1.5 shrink-0"
					><span>🍔</span> FoodDash</a
				>

				<div
					class="bg-orange-100 p-1 flex-1 max-w-sm rounded-full flex items-center gap-1"
				>
					<span class="pl-3 text-sm">🔍</span>
					<input
						type="text"
						placeholder="Знайти страву або ресторан..."
						class="px-3 py-1.5 flex-1 outline-none text-sm placeholder-orange-400"
					/>
				</div>

				<div class="shrink-0 flex gap-3 items-center">
					<button
						class="text-sm text-orange-600 font-semibold hover:text-brand-500 transition-colors"
					>
						<span>📍</span> Київ
					</button>
					<button
						class="relative bg-brand-500 text-orange-100 text-sm font-bold px-4 py-2 rounded-full hover:bg-brand-600 transition-colors"
					>
						<span>🛒</span> Кошик
						<span
							class="absolute -top-1 -right-1 bg-red-500 rounded-full text-xs size-4 flex justify-center items-center"
							>3</span
						>
					</button>
					<button
						class="bg-brand-500 text-white text-sm font-semibold rounded-full size-9 ring-2 ring-orange-200"
					>
						MS
					</button>
				</div>
			</div>
		</header>
		<body>
			<section
				class="bg-linear-to-br from-orange-500 via-orange-400 to-yellow-400 overflow-hidden"
			>
				<div
					class="max-w-7xl mx-auto px-6 py-16 md:py-20 flex items-center gap-10"
				>
					<div class="flex-1 text-white">
						<span
							class="inline-block py-1.5 px-3 font-bold text-xs bg-white/20 rounded-full mb-5"
							>🔥 Топ доставка Києва 2024</span
						>
						<h1
							class="text-4xl md:text-5xl lg:text-6xl font-black leading-none mb-4"
						>
							Смачна їжа <br />
							прямо <span class="text-yellow-200">до дверей</span>
						</h1>
						<p class="text-lg text-orange-100 mb-8 max-w-md">
							Замовляй з 500+ ресторанів. Доставка за 30 хвилин або безкоштовно.
						</p>
						<div class="flex flex-col sm:flex-row gap-3 sm:items-center mb-10">
							<button
								class="py-3 px-6 bg-white text-brand-500 font-bold rounded-full hover:bg-orange-50 transition-colors"
							>
								🛍️ Замовити зараз
							</button>
							<button
								class="py-3 px-6 border-2 border-white/50 font-semibold rounded-full hover:bg-orange-50/10 transition-colors"
							>
								📍 Вибрати адресу
							</button>
						</div>
						<ul class="flex gap-8">
							<li class="flex flex-col">
								<span class="font-black text-2xl">500+</span>
								<span class="text-sm text-orange-200">ресторанів</span>
							</li>
							<li class="flex flex-col">
								<span class="font-black text-2xl">30 хв</span>
								<span class="text-sm text-orange-200">середня доставка</span>
							</li>
							<li class="flex flex-col">
								<span class="font-black text-2xl">4.9★</span>
								<span class="text-sm text-orange-200">рейтинг</span>
							</li>
						</ul>
					</div>
					<div class="flex-1 relative">
						<div
							class="absolute -bottom-2 left-12 bg-white flex flex-col items-center rounded-2xl p-3 shadow-xl"
						>
							<span class="text-2xl mb-1">🍜</span>
							<span class="text-xs font-bold text-gray-700">Рамен</span>
							<span class="text-xs text-orange-500">35 хв</span>
						</div>
						<div
							class="absolute -top-4 right-14 bg-white flex flex-col items-center rounded-2xl p-3 shadow-xl"
						>
							<span class="text-2xl mb-1">🍕</span>
							<span class="text-xs font-bold text-gray-700">Піца</span>
							<span class="text-xs text-orange-500">25 хв</span>
						</div>
						<div
							class="mx-auto w-64 h-64 md:w-80 md:h-80 bg-white/20 rounded-full relative"
						>
							<span class="absolute top-1/2 left-1/2 -translate-1/2 text-9xl"
								>🍔</span
							>
						</div>
					</div>
				</div>
			</section>
		</body>
		<footer></footer>
	</body>
</html>
